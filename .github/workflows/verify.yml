name: Verify portfolio and core behavior
on:
  push:
    branches: [main, portfolio-refresh]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: corepack yarn install --frozen-lockfile --ignore-scripts
      - run: corepack yarn prisma generate
      - run: corepack yarn typecheck
      - run: corepack yarn test
      - run: corepack yarn build:portfolio
      - run: corepack yarn playwright install --with-deps chromium
      - run: corepack yarn test:portfolio
      - run: corepack yarn local:setup
      - run: corepack yarn build
      - name: Verify database-backed learning workflows
        env:
          LOCAL_API_URL: http://127.0.0.1:5220
          NEXTAUTH_URL: http://127.0.0.1:5220
        run: |
          corepack yarn start --hostname 127.0.0.1 --port 5220 > /tmp/tofu-tracker-learning.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid"' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5220/api/auth/session > /dev/null; then break; fi
            sleep 1
          done
          corepack yarn verify:local
          corepack yarn verify:learning
          corepack yarn verify:learning-browser
          corepack yarn verify:grading
          corepack yarn verify:metrics-feedback
          corepack yarn verify:authoring
